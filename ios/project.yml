name: CodePill
options:
  bundleIdPrefix: io.codepill
  deploymentTarget:
    iOS: 16.4
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  CodePill:
    type: application
    platform: iOS
    sources:
      - path: CodePill
    info:
      path: CodePill/App/Info.plist
      properties:
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSLocalNetworkUsageDescription: "CodePill connects to your local Arch Linux server for Antigravity coding."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    dependencies:
      - target: CodePillWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.codepill.app
        INFOPLIST_FILE: CodePill/App/Info.plist
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: YES
        GENERATE_INFOPLIST: NO
        TARGETED_DEVICE_FAMILY: "1"

  CodePillWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CodePillWidget
      - path: CodePill/Models/CodePillAttributes.swift
    info:
      path: CodePillWidget/Info.plist
      properties:
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.codepill.app.widget
        INFOPLIST_FILE: CodePillWidget/Info.plist
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: YES
        GENERATE_INFOPLIST: NO
        TARGETED_DEVICE_FAMILY: "1"
