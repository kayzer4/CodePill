name: CodePill
options:
  bundleIdPrefix: io.codepill
  deploymentTarget:
    iOS: 16.1
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  CodePill:
    type: application
    platform: iOS
    sources:
      - path: CodePill
    dependencies:
      - target: CodePillWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.codepill.app
        INFOPLIST_FILE: CodePill/App/Info.plist
        TARGETED_DEVICE_FAMILY: "1"

  CodePillWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CodePillWidget
      - path: CodePill/Models/CodePillAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.codepill.app.widget
        INFOPLIST_FILE: CodePillWidget/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
