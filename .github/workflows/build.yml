name: CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Server (Rust) ----------
      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Build server (debug)
        working-directory: ./server
        run: cargo build --verbose

      - name: Build server (release)
        working-directory: ./server
        run: cargo build --release --verbose

      # ---------- iOS App ----------
      - name: Install CocoaPods (if needed)
        run: |
          if [ -f "ios/Podfile" ]; then
            sudo gem install cocoapods
            pod install --project-directory=ios
          fi

      - name: Select Xcode version
        run: |
          for xc in /Applications/Xcode_16*.app /Applications/Xcode_15*.app /Applications/Xcode.app; do
            if [ -d "$xc" ]; then
              echo "Selecting $xc"
              sudo xcode-select -s "$xc/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ./ios
        run: xcodegen generate --spec project.yml

      - name: Build iOS app (Debug)
        working-directory: ./ios
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
        run: |
          xcodebuild \
            -project CodePill.xcodeproj \
            -scheme CodePill \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Archive iOS app (Release)
        working-directory: ./ios
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
        run: |
          xcodebuild \
            -project CodePill.xcodeproj \
            -scheme CodePill \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ${{ runner.temp }}/CodePill.xcarchive \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            clean archive

      # ---------- Upload artifacts ----------
      - name: Upload server binary (release)
        uses: actions/upload-artifact@v4
        with:
          name: codepill-server-release
          path: ./server/target/release/codepill-server

      - name: Create unsigned IPA from archive
        run: |
          mkdir -p ${{ runner.temp }}/Payload
          cp -r "${{ runner.temp }}/CodePill.xcarchive/Products/Applications/CodePill.app" "${{ runner.temp }}/Payload/"
          cd ${{ runner.temp }} && zip -r CodePill-unsigned.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: codepill-ipa
          path: ${{ runner.temp }}/CodePill-unsigned.ipa
