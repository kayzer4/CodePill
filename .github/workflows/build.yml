name: Build CodePill

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Native App & Dynamic Island Widget
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          for xcode_path in /Applications/Xcode_16*.app /Applications/Xcode.app; do
            if [ -d "$xcode_path" ]; then
              echo "Selecting $xcode_path"
              sudo xcode-select -s "$xcode_path"
              break
            fi
          done
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate

      - name: Build CodePill Application & Widget Extension
        run: |
          xcodebuild clean build \
            -project ios/CodePill.xcodeproj \
            -scheme CodePill \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload into unsigned IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "CodePill.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r CodePill-unsigned.ipa Payload/

      - name: Upload iOS App & IPA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CodePill-iOS-Release
          path: |
            CodePill-unsigned.ipa
            Payload/CodePill.app

  build-server:
    name: Build Rust Server Daemon (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Server Binary
        run: |
          cargo build --release --manifest-path server/Cargo.toml

      - name: Upload Server Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codepill-server-linux-x86_64
          path: server/target/release/codepill-server
