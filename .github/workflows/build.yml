name: CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Server (Rust) ----------
      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Build server (debug)
        working-directory: ./server
        run: cargo build --verbose

      - name: Build server (release)
        working-directory: ./server
        run: cargo build --release --verbose

      # ---------- iOS App ----------
      - name: Install CocoaPods (if needed)
        run: |
          if [ -f "ios/Podfile" ]; then
            sudo gem install cocoapods
            pod install --project-directory=ios
          fi

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build iOS app (Debug)
        working-directory: ./ios/CodePill
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
        run: |
          xcodebuild \
            -scheme CodePill \
            -configuration Debug \
            -derivedDataPath build \
            -quiet \
            clean build

      - name: Build iOS app (Release IPA)
        working-directory: ./ios/CodePill
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
        run: |
          xcodebuild \
            -scheme CodePill \
            -configuration Release \
            -archivePath ${{ runner.temp }}/CodePill.xcarchive \
            -quiet \
            clean archive
          xcodebuild -exportArchive \
            -archivePath ${{ runner.temp }}/CodePill.xcarchive \
            -exportOptionsPlist ${{ github.workspace }}/ios/ExportOptions.plist \
            -exportPath ${{ runner.temp }}/ExportedIPA \
            -quiet

      # ---------- Upload artifacts ----------
      - name: Upload server binary (release)
        uses: actions/upload-artifact@v4
        with:
          name: codepill-server-release
          path: ./server/target/release/codepill-server

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: codepill-ipa
          path: ${{ runner.temp }}/ExportedIPA/*.ipa
